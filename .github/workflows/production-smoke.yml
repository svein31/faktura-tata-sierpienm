name: Production deployment smoke check
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deployment-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for production and verify public site, database and authentication
        uses: actions/github-script@v7
        with:
          script: |
            const origin = 'https://fakturaprosto.pl';
            // Netlify may queue a production build behind other deploys.
            // Match the exact commit without failing a healthy, older release.
            const deadline = Date.now() + 30 * 60 * 1000;
            let lastFailure = 'Production has not been checked.';
            while (Date.now() < deadline) {
              try {
                const get = path => fetch(origin + path, {
                  headers: { 'Cache-Control': 'no-cache', 'Accept': path === '/' ? 'text/html' : 'application/json' },
                  redirect: 'error',
                  signal: AbortSignal.timeout(15000),
                });
                const health = await get('/api/health');
                const body = await health.json();
                if (health.status !== 200 || body.ok !== true || body.db !== 'ok') throw new Error('Application or database health check failed.');
                if (body.revision !== context.sha) throw new Error('Expected deployment ' + context.sha + ', received ' + (body.revision || 'unknown revision') + '.');
                const home = await get('/');
                const html = await home.text();
                if (home.status !== 200 || !html.includes('Faktury VAT online z KSeF') || !html.includes('Interaktywny podgląd') || !html.includes('id="cennik"') || html.includes('SMS rozlicza dostawca')) throw new Error('The new public page is not available yet.');
                for (const path of ['/cennik', '/porownania/fakturowo', '/porownania/faktura-pl']) {
                  const page = await get(path);
                  const content = await page.text();
                  if (page.status !== 200 || !content.includes('rel="canonical" href="' + origin + path + '"') || content.includes('name="robots" content="noindex')) throw new Error('Public SEO page is unavailable or not indexable: ' + path);
                }
                const missing = await get('/nieistniejaca-strona-audyt');
                if (missing.status !== 404) throw new Error('Unknown public URL must return HTTP 404.');
                for (const path of ['/api/accountant/portal', '/api/tax-estimate', '/api/banking/transfers', '/api/ksef/invoices/download/AUDIT-MISSING-REFERENCE?format=upo']) {
                  const response = await get(path);
                  if (response.status !== 401) throw new Error('Unauthenticated API check failed for ' + path + ': HTTP ' + response.status);
                }
                const llms = await get('/llms.txt');
                if (llms.status !== 200 || !(await llms.text()).includes('/poradnik-ksef/kody-qr')) throw new Error('New SEO release is not live.');
                const preflight = await fetch(origin + '/api/invoices/preflight', { method: 'POST', headers: { Origin: origin, 'Content-Type': 'application/json' }, body: '{}', signal: AbortSignal.timeout(15000) });
                if (preflight.status !== 401) throw new Error('Preflight authentication failed.');
                const ksefAuth = await fetch(origin + '/api/ksef/auth/login', { method: 'POST', headers: { Origin: origin, 'Content-Type': 'application/json' }, body: JSON.stringify({ nip: '5260301706' }), signal: AbortSignal.timeout(15000) });
                if (ksefAuth.status !== 401) throw new Error('KSeF authentication boundary failed.');
                if (home.headers.get('x-content-type-options') !== 'nosniff') throw new Error('Security headers missing.');
                core.info('Production public page, MongoDB and API authentication checks passed.');
                await core.summary
                  .addHeading('Production deployment smoke check')
                  .addTable([
                    [{ data: 'Check', header: true }, { data: 'Result', header: true }],
                    ['Target', origin],
                    ['Release commit', context.sha],
                    ['Deployed revision', body.revision],
                    ['Public page and new pricing/preview', 'HTTP 200 and expected content'],
                    ['Database', 'Health endpoint: ok'],
                    ['Accountant, tax estimate, bank transfers', 'Unauthenticated requests: HTTP 401'],
                    ['KSeF document download', 'Unauthenticated request: HTTP 401; no synthetic UPO'],
                  ])
                  .addRaw('Read-only checks; no invoices, accounts or customer messages were created. This does not test authenticated workflows or external providers.')
                  .write();
                return;
              } catch (error) {
                lastFailure = error.message || error.name || 'Request failed.';
                core.info(lastFailure);
              }
              await new Promise(resolve => setTimeout(resolve, 20000));
            }
            core.setFailed('Production did not pass smoke checks within 30 minutes: ' + lastFailure);
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify the public production site on mobile Chromium and WebKit
        run: node scripts/production-mobile.mjs
      - name: Save production mobile audit screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-mobile-audit
          path: artifacts/mobile
          if-no-files-found: ignore
          retention-days: 7
