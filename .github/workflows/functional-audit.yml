name: Full functional API audit
on:
  push:
    branches: ['codex/full-functional-audit-20260930']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SKIP_BROWSER_CHECKS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 -m pip install lxml==6.0.2
      - run: npx prisma generate && npm run typecheck
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: functional-api-audit
          path: artifacts/functional
          if-no-files-found: ignore
