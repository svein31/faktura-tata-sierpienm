name: Production health monitor
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: production-health-monitor
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public site and database, notify on sustained outage
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[ALERT] FakturaProsto production health';
            const url = 'https://fakturaprosto.pl/api/health';
            const failures = [];
            let healthy = false;
            let deployedRevision = 'unknown';
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch(url, {
                  headers: { 'Accept': 'application/json', 'Cache-Control': 'no-cache' },
                  signal: AbortSignal.timeout(10000),
                });
                const body = await response.json();
                if (response.status === 200 && body.ok === true && body.db === 'ok') {
                  healthy = true;
                  deployedRevision = typeof body.revision === 'string' ? body.revision : 'unknown';
                  break;
                }
                failures.push(`attempt ${attempt}: HTTP ${response.status}, ok=${body.ok === true}, db=${body.db === 'ok'}`);
              } catch (error) {
                failures.push(`attempt ${attempt}: ${error.name || 'request failed'}`);
              }
              if (attempt < 3) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            const { owner, repo } = context.repo;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = openIssues.find(issue => !issue.pull_request && issue.title === title);
            if (healthy) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: 'Sonda zewnętrzna ponownie otrzymała HTTP 200 i potwierdziła dostępność bazy. Sprawdź wpływ przerwy na kolejki KSeF i dokumenty przed zamknięciem incydentu.',
                });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              }
              core.info('Production health and database OK');
              await core.summary
                .addHeading('Production health monitor')
                .addTable([
                  [{ data: 'Check', header: true }, { data: 'Result', header: true }],
                  ['Checked at UTC', new Date().toISOString()],
                  ['Production revision', deployedRevision],
                  ['Application and database', 'HTTP 200; ok=true; db=ok'],
                ])
                .addRaw('Read-only availability check. This does not confirm backup restoration, queue processing, external providers or receipt of an alert by a person.')
                .write();
              return;
            }
            const details = failures.join('\n');
            const body = `Sonda spoza Netlify nie potwierdziła dostępności aplikacji lub bazy po trzech próbach.\n\nURL: ${url}\nCzas UTC: ${new Date().toISOString()}\n\n${details}\n\nSprawdź wdrożenie, logi funkcji i połączenie z MongoDB. Potem sprawdź stan kolejek oraz kopii zapasowych według docs/INCIDENT-RESPONSE.md. Sonda nie weryfikuje kopii ani transakcji KSeF.`;
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
            core.setFailed('Production health failed after three attempts');
