name: Verify operator backup restore
on:
  workflow_dispatch:
  schedule:
    - cron: '10 4 * * 0'
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Back up and verify a temporary isolated restore
        run: node scripts/backup/production-drill.mjs
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
          BACKUP_MONITOR_URL: ${{ secrets.BACKUP_MONITOR_URL }}
          BACKUP_MONITOR_SECRET: ${{ secrets.BACKUP_MONITOR_SECRET }}
