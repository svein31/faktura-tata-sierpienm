name: Verify application
on:
  push:
    branches: ['codex/**', main]
  pull_request:
concurrency:
  group: verify-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      RUN_ALL_MOBILE_CHECKS: '1'
      RUN_WEBKIT_CHECKS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 -m pip install lxml==6.0.2
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify
      - name: Save synthetic mobile audit screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-audit
          path: artifacts/mobile
          if-no-files-found: ignore
