name: Verify application
on:
  push:
    branches: ['codex/**', main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      RUN_ALL_MOBILE_CHECKS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 -m pip install lxml==6.0.2
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
